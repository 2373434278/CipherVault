<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autofill Test Login</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background:#f4f6fb; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { width:min(360px, 88vw); background:#fff; padding:28px; border-radius:16px; box-shadow:0 18px 50px rgba(30,40,80,.12); }
    h1 { font-size:22px; margin:0 0 8px; }
    p { color:#6b7280; font-size:13px; margin:0 0 22px; }
    label { display:block; font-size:12px; color:#4b5563; margin:14px 0 6px; }
    input { width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid #d8dce8; border-radius:10px; font-size:15px; }
    button { margin-top:22px; width:100%; padding:13px; border:0; border-radius:10px; background:#5b4bff; color:#fff; font-size:15px; font-weight:600; }
  </style>
</head>
<body>
  <form class="card" onsubmit="event.preventDefault(); document.getElementById('result').textContent='Submitted: '+document.getElementById('username').value;">
    <h1>Autofill Test</h1>
    <p>点击用户名输入框，选择密匣条目进行填充。</p>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" placeholder="you@example.com">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password">
    <button type="submit">Sign in</button>
    <p id="result" style="margin-top:14px"></p>
  </form>
</body>
</html>
