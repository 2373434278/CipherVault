name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        run: |
          set -euo pipefail
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must look like v<major>.<minor>.<patch>"
            exit 1
          fi
          CORE="${BASH_REMATCH[0]}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CORE"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "No signing keystore configured - building an unsigned APK."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=../keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Build APKs
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug \
            -Pciphervault.versionName="$VERSION_NAME" \
            -Pciphervault.versionCode="$VERSION_CODE" \
            --stacktrace

      - name: Collect artifacts
        run: |
          set -euo pipefail
          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          if [[ -z "$RELEASE_APK" || -z "$DEBUG_APK" ]]; then
            echo "::error::Expected APK outputs were not produced."
            exit 1
          fi
          if [[ "$RELEASE_APK" == *unsigned* ]]; then
            cp "$RELEASE_APK" "CipherVault-${VERSION_NAME}-release-unsigned.apk"
          else
            cp "$RELEASE_APK" "CipherVault-${VERSION_NAME}-release.apk"
          fi
          cp "$DEBUG_APK" "CipherVault-${VERSION_NAME}-debug.apk"
          MAPPING=app/build/outputs/mapping/release/mapping.txt
          if [[ -f "$MAPPING" ]]; then
            gzip -c "$MAPPING" > "CipherVault-${VERSION_NAME}-mapping.txt.gz"
          fi
          sha256sum CipherVault-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CipherVault ${{ env.VERSION_NAME }}
          files: |
            CipherVault-*.apk
            CipherVault-*-mapping.txt.gz
            SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ciphervault-${{ env.VERSION_NAME }}
          path: |
            CipherVault-*.apk
            CipherVault-*-mapping.txt.gz
            SHA256SUMS.txt
          retention-days: 30
